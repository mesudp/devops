apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook-backend
  template:
    metadata:
      labels:
        app: guestbook-backend
    spec:
      containers:
        - name: backend
          image: mesudperik/guestbook-backend:1.1
          ports:
            - containerPort: 5000
          env:
            - name: DBHOST
              value: db
            - name: DBUSER
              valueFrom: 
                secretKeyRef:
                  name: db-secret
                  key: user
            - name: DBPASSWORD
              valueFrom: 
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: DBDATABASE
              value: dbname
            - name: DBPORT
              value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: guestbook-backend-service
spec:
  selector:
    app: guestbook-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP